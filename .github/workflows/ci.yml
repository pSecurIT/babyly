name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: babyly_e2e
          POSTGRES_USER: babyly
          POSTGRES_PASSWORD: babyly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babyly -d babyly_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: web

    env:
      DATABASE_URL: postgresql://babyly:babyly@localhost:5432/babyly_e2e?schema=public
      APP_BASE_URL: http://127.0.0.1:3000
      ACCESS_CODE: ci-only-access-code
      SESSION_SECRET: ci-only-session-secret-please-use-32-chars
      MAGIC_LINK_TTL_MINUTES: 15
      EMAIL_DELIVERY_MODE: console
      ADMIN_EMAILS: admin@example.invalid,admin2@example.invalid
      PRIVACY_CONTACT_EMAIL: privacy@example.invalid
      E2E_RUN_FULL: "1"
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated database
        run: npx prisma db push --accept-data-loss

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit and security tests
        run: npm test

      - name: Run full browser E2E tests
        run: npm run test:e2e